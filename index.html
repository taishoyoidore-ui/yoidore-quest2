<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>大正酔いどれクエスト - 酔いどれ公式ガイドブック</title>
  <meta name="description" content="大正酔いどれクエストの公式ガイドブック案内アプリ。大正区のオモロイ酒場や「酔いどれセット」の内容、酒場クエスト情報をレトロRPG風UIで確認できます。">
  
  <!-- キャッシュ無効化設定（常に最新版をブラウザに取得させる） -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css?v=20260921_10">

  <!-- エラー検知＆デバッグモニター（画面下のモニターに即時出力） -->
  <script>
    window.addEventListener('error', function(e) {
      // <img>タグやフォント等のリソース読み込み通知は除外
      if (e.target && (e.target.tagName === 'IMG' || e.target.tagName === 'LINK' || e.target.tagName === 'AUDIO')) {
        console.warn('リソース読み込みスキップ:', e.target.src || e.target.href);
        return;
      }
      var msg = e.message || (e.error ? e.error.message : '不明なスクリプトエラー');
      var file = e.filename ? e.filename.split('/').pop() : '不明';
      var line = e.lineno || 0;
      
      var logEl = document.getElementById('debug-log-inner');
      if (logEl) {
        logEl.innerHTML = '<div style="color:#ff4757; margin-bottom:2px; font-weight:bold;">❌ [JSエラー] ' + msg + ' (' + file + ':' + line + '行)</div>' + logEl.innerHTML;
      }
    }, true);

    window.addEventListener('unhandledrejection', function(e) {
      var msg = e.reason ? (e.reason.message || e.reason.stack || JSON.stringify(e.reason)) : '不明なPromiseエラー';
      var logEl = document.getElementById('debug-log-inner');
      if (logEl) {
        logEl.innerHTML = '<div style="color:#ff77a8; margin-bottom:2px;">⚠️ [非同期エラー] ' + msg + '</div>' + logEl.innerHTML;
      }
    });

    function debugLog(msg) {
      console.log(msg);
      var logEl = document.getElementById('debug-log-inner');
      if (logEl) {
        var time = new Date().toTimeString().split(' ')[0];
        logEl.innerHTML = '<div style="color:#5ce1e6; margin-bottom:2px;">[' + time + '] ' + msg + '</div>' + logEl.innerHTML;
      }
    }
  </script>
</head>
<body>
  <!-- スマホ風アプリコンテナ -->
  <main class="app-container">
    <!-- レトロRPG風 スタート画面オーバーレイ -->
    <div id="start-overlay" class="start-overlay">
      <div class="start-container">
        <div class="start-title-badge">⚔️ 大正街ぶらイベント 公式ガイド ⚔️</div>
        
        <div class="start-hero-full-box">
          <img src="assets/banner.png" alt="大正酔いどれクエスト" class="start-hero-full-img">
        </div>
        
        <div class="start-btn-box">
          <button id="start-game-btn" class="start-game-btn" type="button">
            <span class="sword-icon">📜</span> PUSH START <span class="sword-icon">📜</span>
          </button>
        </div>
        <p class="start-hint">※タップすると効果音が流れます</p>
      </div>
    </div>

    <!-- ヘッダー -->
    <header class="app-header">
      <div class="header-left-box">
        <h1 class="header-logo">大正酔いどれクエスト</h1>
      </div>
      <div class="header-right-box">
        <button id="header-back-btn" class="header-back-btn hidden" type="button" aria-label="前の画面に戻る">
          ◀ もどる
        </button>
        <button id="sound-toggle-btn" class="sound-toggle-btn" type="button" aria-label="効果音のオンオフ切り替え">
          🔊 音声 ON
        </button>
      </div>
    </header>

    <!-- 酒場一覧用 スティッキースマート絞り込みバー (スクロール時に出現) -->
    <aside id="sticky-filter-bar" class="sticky-filter-bar hidden" aria-label="現在の絞り込み条件">
      <div class="sticky-filter-inner">
        <div class="sticky-filter-left" id="sticky-filter-tags">
          <span class="sticky-icon">🔍</span>
          <span class="sticky-summary-text">全酒場 (33軒)</span>
        </div>
        <button id="sticky-filter-change-btn" class="sticky-filter-btn" type="button">
          条件変更 ▾
        </button>
      </div>
    </aside>

    <!-- メッセージウィンドウ (RPG風テキスト演出) -->
    <section id="message-window-section" class="message-window" aria-live="polite">
      <div id="rpg-message-text">大正のオモロイ酒場を探そう！</div>
    </section>

    <!-- 動的ビュー描画コンテナ -->
    <section id="view-container" class="app-content">
      <!-- JavaScriptにより各画面（トップ/エリア/ジャンル/店舗一覧/詳細/地図）がレンダリングされます -->
    </section>

    <!-- ボトムナビゲーション -->
    <nav class="bottom-nav" aria-label="メインナビゲーション">
      <a href="#" class="nav-item active" data-target-view="top" id="nav-btn-top">
        <span class="nav-item-icon">🍺</span>
        <span>案内所</span>
      </a>
      <a href="#" class="nav-item" data-target-view="stores-all" id="nav-btn-stores">
        <span class="nav-item-icon">🏮</span>
        <span>酒場一覧</span>
      </a>
      <a href="#" class="nav-item" data-target-view="quest-book" id="nav-btn-quest-book">
        <span class="nav-item-icon">📜</span>
        <span>冒険の書</span>
      </a>
      <a href="#" class="nav-item" data-target-view="qr-scan" id="nav-btn-qr-scan">
        <span class="nav-item-icon">📷</span>
        <span>QR読取</span>
      </a>
      <a href="https://maps.app.goo.gl/SqskFzoxuso7NwwL8" target="_blank" rel="noopener noreferrer" class="nav-item" id="nav-btn-map" data-target-view="map">
        <span class="nav-item-icon">📍</span>
        <span>マップ</span>
      </a>
    </nav>
  </main>

  <!-- デバッグ用ログ表示パネル（?debug=1 または重大エラー時のみ表示） -->
  <div id="debug-panel" style="display:none; position:fixed; bottom:65px; left:10px; right:10px; max-height:120px; background:rgba(0,0,0,0.85); border:1px solid #5ce1e6; border-radius:4px; padding:6px; font-size:11px; font-family:monospace; color:#fff; z-index:999999; overflow-y:auto;">
    <div style="font-weight:bold; color:#f8e16c; margin-bottom:2px; display:flex; justify-content:space-between;">
      <span>🛠️ 動作ログモニター</span>
      <button onclick="document.getElementById('debug-log-inner').innerHTML=''" style="background:#333; color:#fff; border:none; padding:1px 6px; border-radius:2px; cursor:pointer;">クリア</button>
    </div>
    <div id="debug-log-inner">初期化完了</div>
  </div>
  <script>
    if (window.location.search.includes('debug=1')) {
      var p = document.getElementById('debug-panel');
      if (p) p.style.display = 'block';
    }
  </script>

  <!-- JS Scripts -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="js/config.js?v=20260921_10"></script>
  <script src="js/api.js?v=20260921_10"></script>
  <script src="js/app.js?v=20260921_10"></script>
</body>
</html>
