<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>大正酔いどれクエストⅡ - 冒険者のスマホ案内所</title>
  <meta name="description" content="大正酔いどれクエストⅡのスマホ向け案内アプリ。大正区のイベント参加店舗や「酔いどれセット」の内容、店舗イベント情報をレトロRPG風UIで確認できます。">
  
  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- CRTレトロスキャンライン風オーバーレイ -->
  <div class="scanlines"></div>

  <!-- スマホ風アプリコンテナ -->
  <main class="app-container">
    <!-- ヘッダー -->
    <header class="app-header">
      <div class="header-title-box">
        <h1 class="header-logo">大正酔いどれクエストⅡ</h1>
        <span class="header-subtitle">Ver.0.2</span>
      </div>
      <button id="sound-toggle-btn" class="sound-toggle-btn" type="button" aria-label="効果音のオンオフ切り替え">
        🔊 音声 ON
      </button>
    </header>

    <!-- メッセージウィンドウ (RPG風テキスト演出) -->
    <section class="message-window" aria-live="polite">
      <div id="rpg-message-text">冒険者ギルドへようこそ！どのコマンドを実行しますか？</div>
    </section>

    <!-- 動的ビュー描画コンテナ -->
    <section id="view-container" class="app-content">
      <!-- JavaScriptにより各画面（トップ/エリア/ジャンル/店舗一覧/詳細/地図）がレンダリングされます -->
    </section>

    <!-- ボトムナビゲーション -->
    <nav class="bottom-nav" aria-label="メインナビゲーション">
      <a href="#" class="nav-item active" data-target-view="top" id="nav-btn-top">
        <span class="nav-item-icon">🏰</span>
        <span>ギルド</span>
      </a>
      <a href="#" class="nav-item" data-target-view="area" id="nav-btn-area">
        <span class="nav-item-icon">🗺</span>
        <span>エリア</span>
      </a>
      <a href="#" class="nav-item" data-target-view="stores-all" id="nav-btn-stores">
        <span class="nav-item-icon">📜</span>
        <span>店舗一覧</span>
      </a>
      <a href="#" class="nav-item" data-target-view="map" id="nav-btn-map">
        <span class="nav-item-icon">📍</span>
        <span>マップ</span>
      </a>
    </nav>
  </main>

  <!-- JS Scripts -->
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
